name: Change request
description: Propose a focused improvement to a Celestial Electric project.
title: "[Change] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: Explain the practical need and how success will be recognized.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Identify the affected capability, existing implementation, and related work.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and review needs
      description: Note access, data, compatibility, deployment, or field implications. Use non-sensitive examples.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What checks or evidence would demonstrate that this change meets its intended scope?
    validations:
      required: true
